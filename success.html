<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна — ИNOE ДЫХАНИЕ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;800&family=Plus+Jakarta+Sans:wght@200;300;500;700&display=swap');
        :root { --accent: #a8dadc; --accent-glow: rgba(168, 218, 220, 0.4); --text-main: #f1faee; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); background: #0d1b2a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
        h1 { font-family: 'Manrope', sans-serif; font-weight: 300; color: #4CAF50; margin-bottom: 20px; font-size: 32px; }
        p { font-size: 16px; opacity: 0.8; margin-bottom: 40px; line-height: 1.6; max-width: 450px; }
        .btn { display: inline-block; padding: 15px 35px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; border-radius: 40px; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 600; transition: 0.4s; }
        .btn:hover { background: var(--accent); color: #0d1b2a; box-shadow: 0 0 20px var(--accent-glow); }
        .icon { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="icon">✨</div>
    <h1>Оплата успешно завершена!</h1>
    <p>Спасибо за доверие. Чек об оплате и ссылка на доступ к материалам курса уже отправлены на вашу электронную почту.</p>
    <a href="/" class="btn">Вернуться на главную</a>
</body>
</html>
